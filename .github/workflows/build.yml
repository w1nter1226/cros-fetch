name: Compile Win exe

on:
  workflow_dispatch: # dammit github i said manual not every commit

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: checkout repo
      uses: actions/checkout@v4

    - name: setup python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'   # <-- fix: 3.14 does not exist

    - name: install deps
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install -r requirements.txt

    - name: build the exe # github default runner uses powershell, fixed syntax.
      run: |
        pyinstaller --onefile --name "cros-fetch" main.py
        # optional debug: verify output exists
        dir dist\  # Windows shell (powershell) syntax

    - name: upload exe artifact
      uses: actions/upload-artifact@v4
      with:
        name: cros-fetch-windows-exe
        path: dist/cros-fetch.exe
